# Checks every push and pull request: the formatting, and that the site
# builds. Publishing is pages.yml's job.
name: CI

on:
  push:
    branches: [main, draft]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
