# Builds the website with Eleventy and publishes it on GitHub Pages, at
# earbee.org, whenever main changes. main is the live site; work happens on
# draft, and publishing is moving main up to it (docs/blog.md, "Publish a
# post"). One-time setup: Settings › Pages › Source "GitHub Actions", the
# custom domain earbee.org, Enforce HTTPS.
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
